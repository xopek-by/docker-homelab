services:
  openobserve:
    # Docker Hub mirror of public.ecr.aws/zinclabs/openobserve (ECR rate-limits anonymous pulls)
    image: openobserve/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
      # Delete logs/traces/metrics older than this many days
      ZO_COMPACT_DATA_RETENTION_DAYS: ${RETENTION_DAYS:-30}
      ZO_TELEMETRY: "false"
      TZ: Europe/Warsaw
    ports:
      # Web UI and OTLP/HTTP ingestion (/api/<org>/v1/logs|traces|metrics)
      - "5080:5080"
      # OTLP/gRPC ingestion
      - "5081:5081"
    volumes:
      - ${DATA_FOLDER}:/data
    deploy:
      resources:
        limits:
          memory: 1500M
    # The image is distroless (no /bin/sh, curl or wget) and the binary has no
    # health subcommand, so a Docker healthcheck cannot run inside it. Liveness is
    # covered by Zabbix (container state) and /healthz from outside.
    healthcheck:
      disable: true
