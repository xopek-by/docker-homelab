services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-otel
    restart: unless-stopped
    environment:
      # Admin user, used only to create the schema and the zabbix user
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Europe/Warsaw
    ports:
      # HTTP interface: Zabbix APM proxy writes here, Zabbix server/frontend read (via Tailscale)
      - "8123:8123"
    volumes:
      - ${DATA_FOLDER}:/var/lib/clickhouse
      - ${LOG_FOLDER}:/var/log/clickhouse-server
      - ./config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
