# /etc/nginx/conf.d/zz-otlp-grpc.conf on the Oracle VM.
# The "zz-" prefix matters: nginx loads conf.d alphabetically and the first server on :443 becomes the default one.
# If this file loads first, every request without a matching SNI (e.g. the frontend behind Cloudflare) hits mTLS and gets 400.
# OTLP/gRPC from the home OTel collectors on the already open port 443, selected by SNI "otlp.apm".
# Both sides authenticate with certificates from the private CA in /etc/nginx/otlp-tls (see README).
server {
    listen 443 ssl http2;
    server_name otlp.apm;

    ssl_certificate         /etc/nginx/otlp-tls/server.crt;
    ssl_certificate_key     /etc/nginx/otlp-tls/server.key;
    ssl_client_certificate  /etc/nginx/otlp-tls/ca.crt;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    location / {
        grpc_pass grpc://127.0.0.1:4317;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }
}
