---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
# Layout (tabs, grid sizes, hidden headers) lives in settings.yaml.

# ===== Tab "Home" =====

# Two zones side by side, each a 2x2 grid (nested groups, layout in settings.yaml).
# Hypervisor: PVE API widget + Glances graphs (REST API on 10.0.0.1:61208, password-protected).
# Storage: NAS pools, backups, photo library, the PVE NVMe datastore.
- Overview:
    - Hypervisor:
        - Proxmox:
            href: https://proxmox.mbuz.uk:8006
            description: Lenovo P520
            icon: proxmox
            widget:
                type: proxmox
                url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
                username: "{{HOMEPAGE_VAR_PROXMOX_PAM}}"
                password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"

        - CPU:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: cpu

        - Memory:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: memory

        - Temperature:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: "sensor:Package id 0"

    - Storage:
        - TrueNAS:
            href: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
            description: Storage
            icon: truenas
            widget:
                type: truenas
                url: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
                key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
                # Pool usage bars (cold, external) matter more than load/uptime
                enablePools: true
                fields: []  # no counters, pool bars only
                nasType: scale

        - Proxmox Backup:
            href: https://10.0.0.201:8007
            description: Backups
            icon: proxmox
            widget:
                type: proxmoxbackupserver
                url: https://10.0.0.201:8007
                # Two wide blocks: with four, "FAILED TASKS 24H" wraps and the card grows
                fields: ["datastore_usage", "failed_tasks_24h"]
                # Read-only token: homepage@pbs!homepage with Audit on /
                username: homepage@pbs!homepage
                password: "{{HOMEPAGE_VAR_PBS_TOKEN}}"

        - Immich:
            href: "{{HOMEPAGE_VAR_IMMICH_URL}}/photos"
            description: Photos
            icon: immich
            widget:
                type: immich
                url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
                key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
                version: 2

        - NVMe disk:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: fs:/mnt/pve/samsung-nvme

# Running the stacks, the network edge, monitoring and code.
- Platform:
    - Komodo:
        href: https://komodo.mbuz.uk
        description: Docker stacks
        icon: komodo
        widget:
            type: komodo
            url: "{{HOMEPAGE_VAR_KOMODO_URL}}"
            key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
            secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
            showSummary: true

    - Gitea:
        href: "{{HOMEPAGE_VAR_GITEA_URL}}/"
        description: Git server
        icon: gitea
        widget:
            type: gitea
            url: "{{HOMEPAGE_VAR_GITEA_URL}}"
            key: "{{HOMEPAGE_VAR_GITEA_KEY}}"

    - AdGuard:
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        description: DNS & DHCP
        icon: adguard-home
        widget:
            type: adguard
            url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
            username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - Nginx Proxy Manager:
        href: "{{HOMEPAGE_VAR_NPM_URL}}/nginx/proxy"
        description: Reverse proxy
        icon: nginx-proxy-manager
        server: apps
        container: nginx-proxy-manager
        widget:
            type: npm
            url: "{{HOMEPAGE_VAR_NPM_URL}}"
            username: "{{HOMEPAGE_VAR_NPM_USER}}"
            password: "{{HOMEPAGE_VAR_NPM_PASS}}"

    - Zabbix:
        href: "{{HOMEPAGE_VAR_ZABBIX_URL}}/"
        description: Monitoring
        icon: zabbix
        siteMonitor: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
        widget:
            type: zabbix
            url: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
            key: "{{HOMEPAGE_VAR_ZABBIX_KEY}}"

# Home Assistant (long-lived token "homepage"): weather + air from HA, the house right now, this week's stats.
# Values are HA templates, so rounding and units are done on the HA side (max 4 fields per card).
- House:
    - Weather:
        href: https://home.mbuz.uk/dash-weather
        description: Gdansk, met.no
        icon: mdi-weather-partly-cloudy
        widget:
            type: homeassistant
            url: "{{HOMEPAGE_VAR_HA_URL}}"
            key: "{{HOMEPAGE_VAR_HA_KEY}}"
            custom:
                - template: "{{ state_attr('weather.home','temperature') | round(0) | int }} °C"
                  label: Now
                - template: "{{ states('weather.home') | replace('partlycloudy','partly cloudy') | replace('clear-night','clear') | replace('-',' ') }}"
                  label: Sky
                - template: "{{ state_attr('weather.home','wind_speed') | round(0) | int }} km/h"
                  label: Wind
                - template: "{{ state_attr('weather.home','humidity') | round(0) | int }} %"
                  label: Humidity

    - Air quality:
        href: https://home.mbuz.uk/dash-weather
        description: Airly, nearest station
        icon: mdi-air-filter
        widget:
            type: homeassistant
            url: "{{HOMEPAGE_VAR_HA_URL}}"
            key: "{{HOMEPAGE_VAR_HA_KEY}}"
            custom:
                - template: "{{ states('sensor.airly_common_air_quality_index') | float(0) | round(0) | int }}"
                  label: CAQI
                - template: "{{ state_attr('sensor.airly_common_air_quality_index','level') }}"
                  label: Level
                - template: "{{ states('sensor.airly_pm2_5') | float(0) | round(0) | int }} µg"
                  label: PM2.5
                - template: "{{ states('sensor.airly_pm10') | float(0) | round(0) | int }} µg"
                  label: PM10

    - Home Assistant:
        href: https://home.mbuz.uk/
        description: Right now
        icon: home-assistant
        server: apps
        container: homeassistant
        widget:
            type: homeassistant
            url: "{{HOMEPAGE_VAR_HA_URL}}"
            key: "{{HOMEPAGE_VAR_HA_KEY}}"
            custom:
                # The printer chamber light is a printer detail, not a room light
                - template: "{{ states.light | rejectattr('entity_id','search','chamber_light') | selectattr('state','eq','on') | list | count }} / {{ states.light | rejectattr('entity_id','search','chamber_light') | list | count }}"
                  label: Lights
                - template: "{{ (states('sensor.smart_plug_a8_power') | float(0) + states('sensor.kitchen_led_power') | float(0)) | round(0) | int }} W"
                  label: Plugs
                - template: "{% set s = states('sensor.a1_03900d610821187_print_status') %}{% if s in ['running','pause','prepare'] %}{{ states('sensor.a1_03900d610821187_print_progress') }} %{% else %}{{ s }}{% endif %}"
                  label: Printer
                - template: "{% if is_state('switch.ps5_540_power','on') %}{{ states('sensor.ps5_540_activity') | replace('none','on') }}{% else %}off{% endif %}"
                  label: PS5

    - This week:
        href: https://home.mbuz.uk/dash-home
        description: Since Monday
        icon: mdi-calendar-week
        widget:
            type: homeassistant
            url: "{{HOMEPAGE_VAR_HA_URL}}"
            key: "{{HOMEPAGE_VAR_HA_KEY}}"
            custom:
                - template: "{{ states('sensor.printer_hours_this_week') | float(0) | round(1) }} h"
                  label: Printer
                - template: "{{ states('sensor.car_km_this_week') | float(0) | round(0) | int }} km"
                  label: Car
                - template: "{{ states('sensor.ps5_played_this_week') | float(0) | round(1) }} h"
                  label: PS5
                - template: "{{ states('sensor.plex_watched_this_week') | float(0) | round(1) }} h"
                  label: Plex

