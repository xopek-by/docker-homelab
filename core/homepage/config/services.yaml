---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
# Layout (grid sizes, hidden headers) lives in settings.yaml.

# 8 cards with live widgets -> 4 columns x 2 rows.
- Overview:
    # Row 1: compute and monitoring
    - Proxmox:
        href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
        description: Lenovo P520
        icon: proxmox
        widget:
            type: proxmox
            url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
            username: "{{HOMEPAGE_VAR_PROXMOX_PAM}}"
            password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"

    - Komodo:
        href: https://komodo.mbuz.uk
        description: Docker stacks
        icon: komodo
        widget:
            type: komodo
            url: "{{HOMEPAGE_VAR_KOMODO_URL}}"
            key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
            secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
            showSummary: true

    - Zabbix:
        href: "{{HOMEPAGE_VAR_ZABBIX_URL}}/"
        description: Monitoring
        icon: zabbix
        siteMonitor: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
        widget:
            type: zabbix
            url: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
            key: "{{HOMEPAGE_VAR_ZABBIX_KEY}}"

    - AdGuard:
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        description: DNS & DHCP
        icon: adguard-home
        widget:
            type: adguard
            url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
            username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    # Row 2: storage, media and edge
    - TrueNAS:
        href: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
        description: Storage
        icon: truenas
        widget:
            type: truenas
            url: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
            key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
            # Pool bars make this card twice as tall as its neighbours; pool usage is in Zabbix
            enablePools: false

    - Immich:
        href: "{{HOMEPAGE_VAR_IMMICH_URL}}/photos"
        description: Photos
        icon: immich
        widget:
            type: immich
            url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
            key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
            version: 2

    - Transmission:
        href: "{{HOMEPAGE_VAR_TRANSMISSION_URL}}/"
        description: Torrents via VPN
        icon: transmission
        server: apps
        container: transmission-openvpn
        widget:
            type: transmission
            url: "{{HOMEPAGE_VAR_TRANSMISSION_URL}}"

    - Nginx Proxy Manager:
        href: "{{HOMEPAGE_VAR_NPM_URL}}/nginx/proxy"
        description: Reverse proxy
        icon: nginx-proxy-manager
        server: apps
        container: nginx-proxy-manager
        widget:
            type: npm
            url: "{{HOMEPAGE_VAR_NPM_URL}}"
            username: "{{HOMEPAGE_VAR_NPM_USER}}"
            password: "{{HOMEPAGE_VAR_NPM_PASS}}"

# Media stack (lab/media): 5 widget cards in one row.
- Media:
    - Plex:
        href: http://10.0.0.101:32400/web
        description: Movies & TV
        icon: plex
        server: apps
        container: plex
        widget:
            type: plex
            url: http://10.0.0.101:32400
            key: "{{HOMEPAGE_VAR_PLEX_KEY}}"

    - Seerr:
        href: https://seerr.mbuz.uk
        description: Requests
        icon: overseerr
        server: apps
        container: seerr
        widget:
            type: overseerr
            url: http://10.0.0.101:5055
            key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

    - Radarr:
        href: https://radarr.mbuz.uk
        description: Movies
        icon: radarr
        server: apps
        container: radarr
        widget:
            type: radarr
            url: http://radarr:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            enableQueue: true

    - Sonarr:
        href: https://sonarr.mbuz.uk
        description: TV shows
        icon: sonarr
        server: apps
        container: sonarr
        widget:
            type: sonarr
            url: http://sonarr:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            enableQueue: true

    - Prowlarr:
        href: https://prowlarr.mbuz.uk
        description: Indexers
        icon: prowlarr
        server: apps
        container: prowlarr
        widget:
            type: prowlarr
            url: http://prowlarr:9696
            key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

# Upcoming movie releases and episodes from Radarr/Sonarr.
- Upcoming:
    - Calendar:
        widget:
            type: calendar
            view: agenda
            maxEvents: 8
            showTime: false
            timezone: Europe/Warsaw
            integrations:
                - type: radarr
                  service_group: Media
                  service_name: Radarr
                  params:
                      unmonitored: false
                - type: sonarr
                  service_group: Media
                  service_name: Sonarr
                  params:
                      unmonitored: false

# 6 plain launcher tiles -> one row of 6.
- Apps:
    - Gitea:
        href: "{{HOMEPAGE_VAR_GITEA_URL}}/"
        description: Git server
        icon: gitea
        siteMonitor: "{{HOMEPAGE_VAR_GITEA_URL}}/"

    - Grafana:
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}/login"
        description: Dashboards
        icon: grafana
        siteMonitor: "{{HOMEPAGE_VAR_GRAFANA_URL}}"

    - Vaultwarden:
        href: "{{HOMEPAGE_VAR_VAULTWARDEN_URL}}"
        description: Passwords
        icon: vaultwarden
        server: apps
        container: vaultwarden

    - Seafile:
        href: "{{HOMEPAGE_VAR_SEAFILE_URL}}"
        description: Documents
        icon: seafile
        siteMonitor: "{{HOMEPAGE_VAR_SEAFILE_URL}}"

    - IT Tools:
        href: "{{HOMEPAGE_VAR_IT_TOOLS_URL}}"
        description: Dev toolbox
        icon: it-tools
        server: apps
        container: it-tools

    - Landing:
        href: "{{HOMEPAGE_VAR_MYSITE_URL}}"
        description: CV website
        icon: si-biolink
        siteMonitor: "{{HOMEPAGE_VAR_MYSITE_URL}}"
