---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
# Layout (tabs, grid sizes, hidden headers) lives in settings.yaml.

# ===== Tab "Home" =====

# Two zones side by side, each a 2x2 grid (nested groups, layout in settings.yaml).
# Hypervisor: PVE API widget + Glances graphs (REST API on 10.0.0.1:61208, password-protected).
# Storage: NAS pools, backups, photo library, the PVE NVMe datastore.
- Overview:
    - Hypervisor:
        - Proxmox:
            href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
            description: Lenovo P520
            icon: proxmox
            widget:
                type: proxmox
                url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
                username: "{{HOMEPAGE_VAR_PROXMOX_PAM}}"
                password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"

        - CPU:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: cpu

        - Memory:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: memory

        - Temperature:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: "sensor:Package id 0"

    - Storage:
        - TrueNAS:
            href: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
            description: Storage
            icon: truenas
            widget:
                type: truenas
                url: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
                key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
                # Pool usage bars (boot-pool, cold, external)
                enablePools: true
                nasType: scale

        - Proxmox Backup:
            href: https://10.0.0.201:8007
            description: Backups
            icon: proxmox
            widget:
                type: proxmoxbackupserver
                url: https://10.0.0.201:8007
                # Read-only token: homepage@pbs!homepage with Audit on /
                username: homepage@pbs!homepage
                password: "{{HOMEPAGE_VAR_PBS_TOKEN}}"

        - Immich:
            href: "{{HOMEPAGE_VAR_IMMICH_URL}}/photos"
            description: Photos
            icon: immich
            widget:
                type: immich
                url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
                key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
                version: 2

        - NVMe disk:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: fs:/mnt/pve/samsung-nvme

# Running the stacks, the network edge, monitoring and code.
- Platform:
    - Komodo:
        href: https://komodo.mbuz.uk
        description: Docker stacks
        icon: komodo
        widget:
            type: komodo
            url: "{{HOMEPAGE_VAR_KOMODO_URL}}"
            key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
            secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
            showSummary: true

    - Nginx Proxy Manager:
        href: "{{HOMEPAGE_VAR_NPM_URL}}/nginx/proxy"
        description: Reverse proxy
        icon: nginx-proxy-manager
        server: apps
        container: nginx-proxy-manager
        widget:
            type: npm
            url: "{{HOMEPAGE_VAR_NPM_URL}}"
            username: "{{HOMEPAGE_VAR_NPM_USER}}"
            password: "{{HOMEPAGE_VAR_NPM_PASS}}"

    - AdGuard:
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        description: DNS & DHCP
        icon: adguard-home
        widget:
            type: adguard
            url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
            username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - Zabbix:
        href: "{{HOMEPAGE_VAR_ZABBIX_URL}}/"
        description: Monitoring
        icon: zabbix
        siteMonitor: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
        widget:
            type: zabbix
            url: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
            key: "{{HOMEPAGE_VAR_ZABBIX_KEY}}"

    - Gitea:
        href: "{{HOMEPAGE_VAR_GITEA_URL}}/"
        description: Git server
        icon: gitea
        widget:
            type: gitea
            url: "{{HOMEPAGE_VAR_GITEA_URL}}"
            key: "{{HOMEPAGE_VAR_GITEA_KEY}}"

# 5 plain launcher tiles -> one row of 5.
- Apps:
    - Grafana:
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}/login"
        description: Dashboards
        icon: grafana
        siteMonitor: "{{HOMEPAGE_VAR_GRAFANA_URL}}"

    - Vaultwarden:
        href: "{{HOMEPAGE_VAR_VAULTWARDEN_URL}}"
        description: Passwords
        icon: vaultwarden
        server: apps
        container: vaultwarden

    - Seafile:
        href: "{{HOMEPAGE_VAR_SEAFILE_URL}}"
        description: Documents
        icon: seafile
        siteMonitor: "{{HOMEPAGE_VAR_SEAFILE_URL}}"

    - IT Tools:
        href: "{{HOMEPAGE_VAR_IT_TOOLS_URL}}"
        description: Dev toolbox
        icon: it-tools
        server: apps
        container: it-tools

    - Landing:
        href: "{{HOMEPAGE_VAR_MYSITE_URL}}"
        description: CV website
        icon: si-biolink
        siteMonitor: "{{HOMEPAGE_VAR_MYSITE_URL}}"

# ===== Tab "Media" =====

# What is playing, what was asked for, what is downloading right now.
- Watching:
    - Plex:
        href: http://10.0.0.101:32400/web
        description: Movies & TV
        icon: plex
        server: apps
        container: plex
        widget:
            type: plex
            url: http://10.0.0.101:32400
            key: "{{HOMEPAGE_VAR_PLEX_KEY}}"

    - Seerr:
        href: https://seerr.mbuz.uk
        description: Requests
        icon: overseerr
        server: apps
        container: seerr
        widget:
            type: overseerr
            url: http://10.0.0.101:5055
            key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

    - Transmission:
        href: "{{HOMEPAGE_VAR_TRANSMISSION_URL}}/"
        description: Torrents via VPN
        icon: transmission
        server: apps
        container: transmission-openvpn
        widget:
            type: transmission
            url: "{{HOMEPAGE_VAR_TRANSMISSION_URL}}"

# The *arr pipeline: counters only, so the cards stay the same height.
- Automation:
    - Radarr:
        href: https://radarr.mbuz.uk
        description: Movies
        icon: radarr
        server: apps
        container: radarr
        widget:
            type: radarr
            url: http://radarr:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Sonarr:
        href: https://sonarr.mbuz.uk
        description: TV shows
        icon: sonarr
        server: apps
        container: sonarr
        widget:
            type: sonarr
            url: http://sonarr:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Prowlarr:
        href: https://prowlarr.mbuz.uk
        description: Indexers
        icon: prowlarr
        server: apps
        container: prowlarr
        widget:
            type: prowlarr
            url: http://prowlarr:9696
            key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

# Calendar next to the two download queues. The queue cards repeat the Radarr/Sonarr
# widgets with only the "queued" counter, so a long queue grows here and nowhere else.
- Activity:
    - Upcoming:
        widget:
            type: calendar
            # Month grid fills the card; agenda with one release left it empty
            view: monthly
            showTime: false
            timezone: Europe/Warsaw
            integrations:
                - type: radarr
                  service_group: Automation
                  service_name: Radarr
                  params:
                      unmonitored: false
                - type: sonarr
                  service_group: Automation
                  service_name: Sonarr
                  params:
                      unmonitored: false

    - Movies queue:
        href: https://radarr.mbuz.uk/activity/queue
        icon: radarr
        widget:
            type: radarr
            url: http://radarr:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            enableQueue: true
            fields: ["queued"]

    - Episodes queue:
        href: https://sonarr.mbuz.uk/activity/queue
        icon: sonarr
        widget:
            type: sonarr
            url: http://sonarr:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            enableQueue: true
            fields: ["queued"]
