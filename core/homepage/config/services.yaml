---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
# Layout (tabs, grid sizes, hidden headers) lives in settings.yaml.

# ===== Tab "Home" =====

# Two zones side by side, each a 2x2 grid (nested groups, layout in settings.yaml).
# Hypervisor: PVE API widget + Glances graphs (REST API on 10.0.0.1:61208, password-protected).
# Storage: NAS pools, backups, photo library, the PVE NVMe datastore.
- Overview:
    - Hypervisor:
        - Proxmox:
            href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
            description: Lenovo P520
            icon: proxmox
            widget:
                type: proxmox
                url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
                username: "{{HOMEPAGE_VAR_PROXMOX_PAM}}"
                password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"

        - CPU:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: cpu

        - Memory:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: memory

        - Temperature:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: "sensor:Package id 0"

    - Storage:
        - TrueNAS:
            href: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
            description: Storage
            icon: truenas
            widget:
                type: truenas
                url: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
                key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
                # Pool usage bars (cold, external) matter more than load/uptime
                enablePools: true
                fields: []  # no counters, pool bars only
                nasType: scale

        - Proxmox Backup:
            href: https://10.0.0.201:8007
            description: Backups
            icon: proxmox
            widget:
                type: proxmoxbackupserver
                url: https://10.0.0.201:8007
                # Two wide blocks: with four, "FAILED TASKS 24H" wraps and the card grows
                fields: ["datastore_usage", "failed_tasks_24h"]
                # Read-only token: homepage@pbs!homepage with Audit on /
                username: homepage@pbs!homepage
                password: "{{HOMEPAGE_VAR_PBS_TOKEN}}"

        - Immich:
            href: "{{HOMEPAGE_VAR_IMMICH_URL}}/photos"
            description: Photos
            icon: immich
            widget:
                type: immich
                url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
                key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
                version: 2

        - NVMe disk:
            widget:
                type: glances
                url: http://10.0.0.1:61208
                username: glances
                password: "{{HOMEPAGE_VAR_GLANCES_PASS}}"
                version: 4
                metric: fs:/mnt/pve/samsung-nvme

# Running the stacks, the network edge, monitoring and code.
- Platform:
    - Komodo:
        href: https://komodo.mbuz.uk
        description: Docker stacks
        icon: komodo
        widget:
            type: komodo
            url: "{{HOMEPAGE_VAR_KOMODO_URL}}"
            key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
            secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
            showSummary: true

    - Gitea:
        href: "{{HOMEPAGE_VAR_GITEA_URL}}/"
        description: Git server
        icon: gitea
        widget:
            type: gitea
            url: "{{HOMEPAGE_VAR_GITEA_URL}}"
            key: "{{HOMEPAGE_VAR_GITEA_KEY}}"

    - AdGuard:
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        description: DNS & DHCP
        icon: adguard-home
        widget:
            type: adguard
            url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
            username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - Nginx Proxy Manager:
        href: "{{HOMEPAGE_VAR_NPM_URL}}/nginx/proxy"
        description: Reverse proxy
        icon: nginx-proxy-manager
        server: apps
        container: nginx-proxy-manager
        widget:
            type: npm
            url: "{{HOMEPAGE_VAR_NPM_URL}}"
            username: "{{HOMEPAGE_VAR_NPM_USER}}"
            password: "{{HOMEPAGE_VAR_NPM_PASS}}"

    - Zabbix:
        href: "{{HOMEPAGE_VAR_ZABBIX_URL}}/"
        description: Monitoring
        icon: zabbix
        siteMonitor: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
        widget:
            type: zabbix
            url: "{{HOMEPAGE_VAR_ZABBIX_URL}}"
            key: "{{HOMEPAGE_VAR_ZABBIX_KEY}}"

# Gdansk outside: air quality, today/tomorrow forecast, daylight (Open-Meteo, no API key).
- Outside:
    - Air quality:
        href: https://www.iqair.com/poland/pomerania/gdansk
        description: European AQI, µg/m³
        icon: mdi-air-filter
        widget:
            type: customapi
            url: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=54.372158&longitude=18.638306&current=european_aqi,pm2_5,pm10,nitrogen_dioxide&timezone=Europe%2FWarsaw"
            refreshInterval: 900000 # 15 min
            mappings:
                - field: { current: european_aqi }
                  label: AQI
                  format: number
                - field: { current: pm2_5 }
                  label: PM2.5
                  format: float
                - field: { current: pm10 }
                  label: PM10
                  format: float
                - field: { current: nitrogen_dioxide }
                  label: NO2
                  format: float

    - Today:
        href: https://www.yr.no/en/forecast/daily-table/2-3099434/Poland/Pomerania/Gda%C5%84sk/Gda%C5%84sk
        description: Gdansk forecast
        icon: mdi-weather-partly-cloudy
        widget:
            type: customapi
            url: "https://api.open-meteo.com/v1/forecast?latitude=54.372158&longitude=18.638306&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,daylight_duration&forecast_days=2&timezone=Europe%2FWarsaw"
            refreshInterval: 900000 # 15 min
            mappings:
                - field: { daily: { temperature_2m_max: 0 } }
                  label: Max
                  format: float
                  suffix: "°C"
                - field: { daily: { temperature_2m_min: 0 } }
                  label: Min
                  format: float
                  suffix: "°C"
                - field: { daily: { precipitation_probability_max: 0 } }
                  label: Rain
                  format: percent
                - field: { daily: { wind_speed_10m_max: 0 } }
                  label: Wind
                  format: number
                  suffix: " km/h"

    - Tomorrow:
        href: https://www.yr.no/en/forecast/daily-table/2-3099434/Poland/Pomerania/Gda%C5%84sk/Gda%C5%84sk
        description: Gdansk forecast
        icon: mdi-weather-partly-cloudy
        widget:
            type: customapi
            url: "https://api.open-meteo.com/v1/forecast?latitude=54.372158&longitude=18.638306&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,daylight_duration&forecast_days=2&timezone=Europe%2FWarsaw"
            refreshInterval: 900000 # 15 min
            mappings:
                - field: { daily: { temperature_2m_max: 1 } }
                  label: Max
                  format: float
                  suffix: "°C"
                - field: { daily: { temperature_2m_min: 1 } }
                  label: Min
                  format: float
                  suffix: "°C"
                - field: { daily: { precipitation_probability_max: 1 } }
                  label: Rain
                  format: percent
                - field: { daily: { wind_speed_10m_max: 1 } }
                  label: Wind
                  format: number
                  suffix: " km/h"

    - Daylight:
        href: https://www.timeanddate.com/sun/poland/gdansk
        description: Sunrise and sunset today
        icon: mdi-weather-sunset
        widget:
            type: customapi
            url: "https://api.open-meteo.com/v1/forecast?latitude=54.372158&longitude=18.638306&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,daylight_duration&forecast_days=2&timezone=Europe%2FWarsaw"
            refreshInterval: 900000 # 15 min
            mappings:
                - field: { daily: { sunrise: 0 } }
                  label: Sunrise
                  format: text # "2026-11-11T07:06", custom.css shows only the HH:MM tail
                - field: { daily: { sunset: 0 } }
                  label: Sunset
                  format: text # "2026-11-11T07:06", custom.css shows only the HH:MM tail
                - field: { daily: { daylight_duration: 0 } }
                  label: Day length
                  format: duration

