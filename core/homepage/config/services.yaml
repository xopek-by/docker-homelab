        href: https://books.mbuz.uk
        description: Calibre-Web, Send to Kindle
        icon: calibre-web
        server: apps
        container: calibre-web
        widget:
            type: calibreweb
            url: http://calibre-web:8083
            username: mbuz
            password: "{{HOMEPAGE_VAR_CALIBREWEB_PASS}}"
