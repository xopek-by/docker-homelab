# The *arr pipeline: counters only, so the cards stay the same height.
- Automation:
    - Radarr:
        href: https://radarr.mbuz.uk
        description: Movies
        icon: radarr
        server: apps
        container: radarr
        widget:
            type: radarr
            url: http://radarr:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Sonarr:
        href: https://sonarr.mbuz.uk
        description: TV shows
        icon: sonarr
        server: apps
        container: sonarr
        widget:
            type: sonarr
            url: http://sonarr:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Prowlarr:
        href: https://prowlarr.mbuz.uk
        description: Indexers
        icon: prowlarr
        server: apps
        container: prowlarr
        widget:
            type: prowlarr
            url: http://prowlarr:9696
            key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

# Calendar next to the two download queues. The queue cards repeat the Radarr/Sonarr
# widgets with only the "queued" counter, so a long queue grows here and nowhere else.
- Activity:
    - Upcoming:
        widget:
            type: calendar
            # Month grid fills the card; agenda with one release left it empty
            view: monthly
            showTime: false
            timezone: Europe/Warsaw
            integrations:
                - type: radarr
                  service_group: Automation
                  service_name: Radarr
                  params:
                      unmonitored: false
                - type: sonarr
                  service_group: Automation
                  service_name: Sonarr
                  params:
                      unmonitored: false

    - Movies queue:
        href: https://radarr.mbuz.uk/activity/queue
        icon: radarr
        widget:
            type: radarr
            url: http://radarr:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            enableQueue: true
            fields: ["queued"]

    - Episodes queue:
        href: https://sonarr.mbuz.uk/activity/queue
        icon: sonarr
        widget:
            type: sonarr
            url: http://sonarr:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            enableQueue: true
            fields: ["queued"]

# Books: library (Calibre-Web Automated) and the wanted list (LazyLibrarian, no Homepage widget).
- Books:
    - Library:
        href: https://books.mbuz.uk
        description: Calibre-Web, Send to Kindle
        icon: calibre-web
        server: apps
        container: calibre-web
        widget:
            type: calibreweb
            url: http://calibre-web:8083
            username: mbuz
            password: "{{HOMEPAGE_VAR_CALIBREWEB_PASS}}"
            fields: ["books", "authors", "series"]

    - LazyLibrarian:
        href: https://lazylibrarian.mbuz.uk
        description: Wanted books, downloads
        icon: lazylibrarian
        server: apps
        container: lazylibrarian
