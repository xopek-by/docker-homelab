---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/
# Glances was removed: nothing listens on 10.0.0.1:61208, and the Proxmox card shows CPU/RAM.

- greeting:
    text_size: xl
    text: Homelab

- openmeteo:
    label: Gdansk
    latitude: 54.372158
    longitude: 18.638306
    timezone: Europe/Warsaw
    units: metric
    cache: 5 # minutes, to stay within API limits
    format:
      maximumFractionDigits: 1

- datetime:
    locale: pl
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
