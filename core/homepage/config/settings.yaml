---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot        # small status dot instead of "176 MS" / "UNKNOWN" badges
hideVersion: true
useEqualHeights: true   # cards in the same row get the same height

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false

# Two tabs. Every group (services and bookmarks) is pinned to a tab, so nothing
# leaks onto both. Group headers are shown: each row is one logical section.
#   Home:  Hypervisor (5), Storage (3), Platform (5), Apps (5), bookmarks
#   Media: Watching, Automation, Activity (calendar + queues)
layout:
  Hypervisor:
    tab: Home
    style: row
    columns: 5
  Storage:
    tab: Home
    style: row
    columns: 3
  Platform:
    tab: Home
    style: row
    columns: 5
  Apps:
    tab: Home
    style: row
    columns: 5
  Infrastructure:
    tab: Home
  AI:
    tab: Home
  Dev:
    tab: Home
  Reference:
    tab: Home
  Watching:
    tab: Media
    style: row
    columns: 3
  Automation:
    tab: Media
    style: row
    columns: 3
  Activity:
    tab: Media
    style: row
    columns: 3
