---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Homelab
theme: dark
color: zinc         # neutral greys; the mood comes from custom.css (aurora background, glass cards)
headerStyle: clean
statusStyle: dot        # small status dot instead of "176 MS" / "UNKNOWN" badges
hideVersion: true
useEqualHeights: true   # cards in the same row get the same height

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false

# Two tabs. Every group is pinned to a tab, so nothing
# leaks onto both. Group headers are shown: each row is one logical section.
#   Home:  Hypervisor | Storage side by side (2x2 each), Platform (5), Outside (4), Apps (5)
#   Media: Watching, Automation, Activity (calendar + queues)
layout:
  Overview:
    tab: Home
    style: row
    columns: 2
    header: false
    Hypervisor:
      style: row
      columns: 2
    Storage:
      style: row
      columns: 2
  Platform:
    tab: Home
    style: row
    columns: 5
  Outside:
    tab: Home
    style: row
    columns: 4
  Apps:
    tab: Home
    style: row
    columns: 5
  Watching:
    tab: Media
    style: row
    columns: 3
  Automation:
    tab: Media
    style: row
    columns: 3
  Activity:
    tab: Media
    style: row
    columns: 3
