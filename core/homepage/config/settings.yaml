---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot        # small status dot instead of "176 MS" / "UNKNOWN" badges
hideVersion: true
useEqualHeights: true   # cards in the same row get the same height

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false

# Two tabs. Every group (services and bookmarks) is pinned to a tab, so nothing
# leaks onto both. Headers are hidden: the tab name already says what it is.
#   Home:  infrastructure widgets (4 + 3), launcher tiles, bookmarks
#   Media: what is playing/downloading, the *arr pipeline, then calendar + queues
layout:
  Core:
    tab: Home
    style: row
    columns: 4
    header: false
  Services:
    tab: Home
    style: row
    columns: 3
    header: false
  Apps:
    tab: Home
    style: row
    columns: 6
    header: false
  Infrastructure:
    tab: Home
  AI:
    tab: Home
  Dev:
    tab: Home
  Reference:
    tab: Home
  Watch:
    tab: Media
    style: row
    columns: 3
    header: false
  Automation:
    tab: Media
    style: row
    columns: 3
    header: false
  Activity:
    tab: Media
    style: row
    columns: 3
    header: false
