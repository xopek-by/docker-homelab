---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot        # small status dot instead of "176 MS" / "UNKNOWN" badges
hideVersion: true
useEqualHeights: true   # cards in the same row get the same height

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false

# Two service blocks without titles: a 4x2 grid of widget cards on top,
# a single row of 6 plain launcher tiles below. Bookmarks follow as 4 columns.
layout:
  Overview:
    style: row
    columns: 4
    header: false
  Media:
    style: row
    columns: 5
    header: false
  Upcoming:
    style: row
    columns: 1
    header: false
  Apps:
    style: row
    columns: 6
    header: false
