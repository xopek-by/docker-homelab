# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
# Authelia: single sign-on + 2FA in front of NPM proxy hosts (forward auth) and OIDC later.
# Secrets come from /secrets/* via *_FILE env vars (see docker-compose.yaml).

theme: auto

server:
  address: 'tcp://:9091/'

log:
  level: info

totp:
  issuer: 'mbuz.uk'
  period: 30
  digits: 6

webauthn:
  disable: false
  display_name: 'mbuz homelab'
  # Allow logging in with a passkey instead of password + second factor
  enable_passkey_login: true

authentication_backend:
  # Password reset needs a working mail notifier; disabled until SMTP is set up
  password_reset:
    disable: true
  file:
    # Lives on the host, not in git; holds the argon2 hash of the user's password
    path: '/data/users_database.yml'
    watch: true
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.mbuz.uk'
      policy: 'bypass'
    # Everything else behind Authelia requires password + TOTP/passkey
    - domain: '*.mbuz.uk'
      policy: 'two_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '2h'
  expiration: '12h'
  remember_me: '1M'
  cookies:
    - domain: 'mbuz.uk'
      authelia_url: 'https://auth.mbuz.uk'
      default_redirection_url: 'https://mbuz.uk'

regulation:
  max_retries: 5
  find_time: '10m'
  ban_time: '30m'

storage:
  local:
    path: '/data/db.sqlite3'

identity_providers:
  # OpenID Connect provider for apps that support OIDC login (Immich, Vaultwarden, ...).
  # All secrets are read from /secrets/* through the template filter (X_AUTHELIA_CONFIG_FILTERS=template);
  # client_secret values are pbkdf2 digests, the plaintext secrets stay on the host only.
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/OIDC_JWKS_RSA_KEY" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: {{ secret "/secrets/IMMICH_CLIENT_SECRET_DIGEST" | msquote }}
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://immich.mbuz.uk/auth/login'
          - 'https://immich.mbuz.uk/user-settings'
          # Direct LAN access (bypasses NPM)
          - 'http://10.0.0.102:2283/auth/login'
          - 'http://10.0.0.102:2283/user-settings'
          - 'app.immich:///oauth-callback'
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

      - client_id: 'vaultwarden'
        client_name: 'Vaultwarden'
        client_secret: {{ secret "/secrets/VAULTWARDEN_CLIENT_SECRET_DIGEST" | msquote }}
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://pass.mbuz.uk/identity/connect/oidc-signin'
        scopes: ['openid', 'offline_access', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

      - client_id: 'proxmox'
        client_name: 'Proxmox VE'
        client_secret: {{ secret "/secrets/PROXMOX_CLIENT_SECRET_DIGEST" | msquote }}
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
        require_pkce: false
        redirect_uris:
          # The web UI origin the user opens Proxmox with
          - 'https://10.0.0.1:8006'
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

notifier:
  # One-time codes (e.g. when registering TOTP/passkey) are written to this file
  # until an SMTP or other notifier is configured.
  filesystem:
    filename: '/data/notification.txt'
