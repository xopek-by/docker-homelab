services:
  app:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy-manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_ADMIN_PORT:-81}:81"
      - "${NPM_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_DATA}:/data
      - ${NGINX_LETSENCRYPT}:/etc/letsencrypt
      # Authelia forward-auth snippets, used from proxy host "Advanced" configs
      - ./snippets:/snippets:ro
    networks:
      - default
      # Shared with Authelia and other services that should be reachable only via NPM
      - proxy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s

networks:
  proxy:
    external: true